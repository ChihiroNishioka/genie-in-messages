name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked text
        run: python3 scripts/check-tracked-text.py

  macos:
    runs-on: macos-14
    steps:
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          swift --version
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build menu bar app
        run: swift build --product GenieMenuBar

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Test core
        run: swift test
      - name: Test mutant verdict parser
        run: python3 -I tools/test_check_mutants.py
      - name: Probe mutant verdicts
        run: python3 tools/check-mutants.py --probes
      - name: 壊して確かめる
        run: python3 tools/check-mutants.py

  mutation-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Mutate
        run: bash tools/run-mutants.sh linux

  mutation-macos:
    runs-on: macos-14
    steps:
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          swift --version
      - uses: actions/checkout@v4
      - name: Mutate
        run: bash tools/run-mutants.sh macos

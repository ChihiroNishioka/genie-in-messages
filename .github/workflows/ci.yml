name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check tracked text
        run: python3 scripts/check-tracked-text.py

  macos:
    runs-on: macos-14
    steps:
      - name: Select Xcode 16.2
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          swift --version
      - uses: actions/checkout@v4
      - name: Test
        run: swift test
      - name: Build menu bar app
        run: swift build --product GenieMenuBar

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0.3"
      - name: Test core
        run: swift test
